[project]
name = "web-search-mcp"
version = "0.1.0"
description = "MCP server providing web search and page fetch tools over plain HTTP, with no browser or API key required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Patil" }]
keywords = ["mcp", "model-context-protocol", "web-search", "bing", "duckduckgo"]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.scripts]
web-search-mcp = "web_search_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/nishantapatil3/mcps"
Issues = "https://github.com/nishantapatil3/mcps/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require live network access"]
