[project]
name = "location-tools"
version = "0.1.0"
description = "MCP server providing location tools: IP geolocation, forward/reverse geocoding, timezone lookup, and distance, with no API key required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Patil" }]
keywords = ["mcp", "model-context-protocol", "geocoding", "geolocation", "nominatim"]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27",
]

[project.scripts]
location-tools = "location_tools.__main__:main"

[project.urls]
Homepage = "https://github.com/nishantapatil3/mcps"
Issues = "https://github.com/nishantapatil3/mcps/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/location_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require live network access"]
# Live checks are opt-in (`pytest -m network`) so the default suite stays
# deterministic and runnable offline.
addopts = "-m 'not network'"
