[project]
name = "web-tools"
version = "0.1.0"
description = "MCP server providing web search and page fetch tools over plain HTTP, with no browser or API key required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Patil" }]
keywords = ["mcp", "model-context-protocol", "web-search", "duckduckgo"]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
# Chrome TLS impersonation. Search engines and Cloudflare-fronted sites
# increasingly block on TLS fingerprint rather than headers, which no amount of
# header tuning fixes; curl_cffi is the fallback that gets through. Optional
# because it ships compiled wheels and most fetches never need it.
browser = ["curl_cffi>=0.7"]

[project.scripts]
web-tools = "web_tools.__main__:main"

[project.urls]
Homepage = "https://github.com/nishantapatil3/mcps"
Issues = "https://github.com/nishantapatil3/mcps/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require live network access"]
# Live checks are opt-in (`pytest -m network`) so the default suite stays
# deterministic and runnable offline.
addopts = "-m 'not network'"
